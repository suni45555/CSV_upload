_schema-version: "3.1"
ID: capm-csv-upload
version: 1.0.0
description: CAPM CSV Upload with XSUAA Authentication

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p approuter/webapp
        - cp -r app/* approuter/webapp/

modules:
  # CAP Server
  - name: capm-csv-upload-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: capm-csv-upload-db
      - name: capm-csv-upload-uaa
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # App Router
  - name: capm-csv-upload-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      memory: 128M
      disk-quota: 256M
    requires:
      - name: capm-csv-upload-uaa
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # HANA DB Deployer
  - name: capm-csv-upload-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: capm-csv-upload-db

resources:
  # HANA HDI Container
  - name: capm-csv-upload-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # XSUAA Service
  - name: capm-csv-upload-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json


